# Lets you trigger Claude from GitHub: mention @claude in an issue,
# an issue comment, or a PR comment, and it works in the background.
# Place this file at: .github/workflows/claude.yml

name: Claude

on:
  issues:
    types: [opened, assigned]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]

# Only one Claude run per issue/PR at a time
concurrency:
  group: claude-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # Run only when @claude is mentioned AND the person is you (the repo owner),
    # so nobody else can spend your usage on a public repo.
    if: |
      (
        (github.event_name == 'issues' &&
          (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')) &&
          github.event.issue.author_association == 'OWNER') ||
        (github.event_name == 'issue_comment' &&
          contains(github.event.comment.body, '@claude') &&
          github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review_comment' &&
          contains(github.event.comment.body, '@claude') &&
          github.event.comment.author_association == 'OWNER') ||
        (github.event_name == 'pull_request_review' &&
          contains(github.event.review.body, '@claude') &&
          github.event.review.author_association == 'OWNER')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude
        uses: anthropics/claude-code-action@v1
        with:
          # Using your Claude subscription. If you'd rather pay per use with an
          # API key, swap this line for:
          #   anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: "--max-turns 40"
