name: Build Windows installer

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    tags: ['v*']            # pushing a tag like v0.1.0 also publishes a Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle SotN Randomizer + map tracker data
        run: npm run setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show randomizer options
        shell: bash
        run: |
          cd vendor/sotn-randomizer
          node randomize --help || true
          ls presets || true
          cd ../sotnrandotools && cat VERSION.txt && find . -maxdepth 2 | sort | head -80
          node -e "const fs=require('fs');for(const f of fs.readdirSync('Extensions')){const e=JSON.parse(fs.readFileSync('Extensions/'+f));console.log('==',f,'extends='+e.extends,'small='+e.smallIndicators,'n='+(e.locations||[]).length);for(const l of (e.locations||[]))console.log(JSON.stringify(l))}" || true
          node -e "const p=JSON.parse(require('fs').readFileSync('../sotn-randomizer/presets/safe.json'));console.log(Object.keys(p));console.log(JSON.stringify(p).slice(0,1500))" || true
          node -e "const p=JSON.parse(require('fs').readFileSync('../sotn-randomizer/presets/sequence-breaker.json'));console.log(Object.keys(p));console.log(JSON.stringify(p.lockLocation||'').slice(0,600))" || true
          file Images/* 2>/dev/null | head -20 || ls -la Images

      - name: Run tests
        run: npm test

      - name: Build installer + portable exe
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test seed generation inside the packaged app
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: '"dist/win-unpacked/PSX Rando Hub.exe" scripts/smoke-packaged.js'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Rando-Hub-Windows
          path: dist/*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
