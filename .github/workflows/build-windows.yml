name: Build Windows installer

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    tags: ['v*']            # pushing a tag like v0.1.0 also publishes a Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle SotN Randomizer
        run: npm run setup

      - name: Run tests
        run: npm test

      - name: Build installer + portable exe
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Rando-Hub-Windows
          path: dist/*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
