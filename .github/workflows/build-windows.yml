name: Build Windows installer

on:
  workflow_dispatch:        # "Run workflow" button on the Actions tab
  push:
    tags: ['v*']            # pushing a tag like v0.1.0 also publishes a Release

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install app dependencies
        run: npm install --no-audit --no-fund

      - name: Bundle SotN Randomizer + map tracker data
        run: npm run setup
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show randomizer options
        shell: bash
        run: |
          cd vendor/sotn-randomizer
          node randomize --help || true
          ls presets || true
          cd ../sotnrandotools && cat VERSION.txt && ls Extensions Images

      - name: Run tests
        run: npm test

      - name: Build installer + portable exe
        run: npx electron-builder --win nsis portable --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Smoke-test seed generation inside the packaged app
        shell: bash
        env:
          ELECTRON_RUN_AS_NODE: '1'
        run: '"dist/win-unpacked/PSX Rando Hub.exe" scripts/smoke-packaged.js'

      - name: Test the installer (silent install with a license file beside it)
        shell: pwsh
        run: |
          $v = node -p "require('./package.json').version"
          $t = Join-Path $env:RUNNER_TEMP 'setup-test'
          New-Item -ItemType Directory -Force $t | Out-Null
          Copy-Item "dist/PSX-Rando-Hub-Setup-$v.exe" "$t/PSX Rando Hub Setup.exe"
          '{"name":"Test","build":"TEST01","token":"0000","server":"https://example.invalid"}' | Set-Content "$t/license.json"
          $p = Start-Process "$t/PSX Rando Hub Setup.exe" -ArgumentList '/S' -Wait -PassThru
          "installer exit code: $($p.ExitCode)"
          $dir = Get-ChildItem "$env:LOCALAPPDATA\Programs" -Directory | Where-Object { Test-Path (Join-Path $_.FullName 'PSX Rando Hub.exe') } | Select-Object -First 1
          if (-not $dir) { throw 'PSX Rando Hub.exe was not installed' }
          "installed to $($dir.FullName)"
          if (-not (Test-Path (Join-Path $dir.FullName 'license.json'))) { throw 'license.json was not copied into the install folder' }
          'license.json copied into the install folder'

      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: PSX-Rando-Hub-Windows
          path: dist/*.exe

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
