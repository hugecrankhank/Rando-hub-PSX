<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Emulator</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  #game { width: 100%; height: 100%; }
  #err { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
         color: #e9d9b0; font: 15px/1.5 "Segoe UI", sans-serif; padding: 40px; text-align: center; }
</style>
<script>
  // Capture the emulator core's WebAssembly memory before EmulatorJS loads, so the hub
  // can read PS1 RAM for auto-tracking without needing any special core build.
  (function () {
    const hook = (window.__psxHook = { memories: [], exportsList: [] });
    const remember = (imports, result) => {
      try {
        const inst = result && (result.instance || result);
        const ex = inst && inst.exports;
        if (ex) {
          hook.exportsList.push(ex);
          for (const v of Object.values(ex)) if (v instanceof WebAssembly.Memory) hook.memories.push(v);
        }
        if (imports) {
          for (const mod of Object.values(imports)) {
            if (!mod || typeof mod !== 'object') continue;
            for (const v of Object.values(mod)) if (v instanceof WebAssembly.Memory && !hook.memories.includes(v)) hook.memories.push(v);
          }
        }
      } catch (_) { /* never break the emulator */ }
      return result;
    };
    const W = WebAssembly;
    const inst = W.instantiate.bind(W);
    W.instantiate = (src, imports) => inst(src, imports).then((r) => remember(imports, r));
    if (W.instantiateStreaming) {
      const instS = W.instantiateStreaming.bind(W);
      W.instantiateStreaming = (src, imports) => instS(src, imports).then((r) => remember(imports, r));
    }
    const OrigInstance = W.Instance;
    W.Instance = function (mod, imports) {
      const i = new OrigInstance(mod, imports);
      remember(imports, i);
      return i;
    };
    W.Instance.prototype = OrigInstance.prototype;
  })();
</script>
</head>
<body>
<div id="game"></div>
<div id="err"></div>
<canvas id="mapOverlay" style="position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:5"></canvas>
<script>
  const q = new URLSearchParams(location.search);
  window.EJS_player = '#game';
  window.EJS_core = q.get('core') || 'psx';
  window.EJS_gameUrl = q.get('game');
  window.EJS_biosUrl = q.get('bios');
  window.EJS_gameName = q.get('name') || 'game';
  window.EJS_pathtodata = q.get('data');
  window.EJS_startOnLoaded = true;
  window.EJS_color = '#8a1c24';
  window.EJS_backgroundColor = '#000000';
  window.EJS_threads = false;
  window.EJS_disableDatabases = false;
  // Force every frame to be drawn. With frameskip on, the core still reports
  // 60 fps but only every other frame reaches the screen (smooth-looking 30).
  window.EJS_defaultOptions = {
    'save-state-location': 'browser',
    'pcsx_rearmed_frameskip_type': 'disabled',
    'pcsx_rearmed_frameskip': '0',
    'beetle_psx_hw_frame_duping': 'disabled',
    'frameskip': '0',
  };

  // Measure how often the browser actually presents frames in this frame.
  // If this reads ~30 while the emulator says 60, Windows/Chromium is capping
  // the display rate (battery saver, power mode, etc.), not the emulator.
  //
  // Also count game frames: every new emulated frame is uploaded to a WebGL
  // texture. "made" = uploads per second; "shown" = screen refreshes that got
  // at least one new frame. made 60 / shown 30 means two frames are being
  // produced per refresh and one is never seen.
  (function measureFrames() {
    let uploads = 0, pending = false;
    const wrap = (gl) => {
      if (!gl || gl.__psxWrapped) return gl;
      gl.__psxWrapped = true;
      for (const fn of ['texSubImage2D', 'texImage2D']) {
        const orig = gl[fn];
        if (typeof orig !== 'function') continue;
        gl[fn] = function (...a) {
          // texSubImage2D(target, level, x, y, w, h, ...) / texImage2D(target, level, ifmt, w, h, ...)
          const w = fn === 'texSubImage2D' ? a[4] : a[3];
          if (typeof w === 'number' && w >= 200) {
            uploads++; pending = true;
            const h = fn === 'texSubImage2D' ? a[5] : a[4];
            if (typeof h === 'number' && h >= 150) window.__psxFrame = { w, h };
          }
          return orig.apply(this, a);
        };
      }
      return gl;
    };
    const origGet = HTMLCanvasElement.prototype.getContext;
    HTMLCanvasElement.prototype.getContext = function (type, ...rest) {
      const ctx = origGet.call(this, type, ...rest);
      return /webgl/i.test(type) ? wrap(ctx) : ctx;
    };

    let ticks = 0, shown = 0, t0 = performance.now();
    const tick = (t) => {
      ticks++;
      if (pending) { shown++; pending = false; }
      if (t - t0 >= 1000) {
        const k = 1000 / (t - t0);
        parent.postMessage({
          type: 'emu:display',
          fps: Math.round(ticks * k),
          made: Math.round(uploads * k),
          shown: Math.round(shown * k),
        }, location.origin);
        ticks = 0; shown = 0; uploads = 0; t0 = t;
      }
      requestAnimationFrame(tick);
    };
    requestAnimationFrame(tick);
  })();
  window.EJS_ready = () => parent.postMessage({ type: 'emu:ready' }, location.origin);
  window.EJS_onGameStart = () => parent.postMessage({ type: 'emu:started' }, location.origin);

  // Map-tracker overlay. The parent passes marker rects in SOTN map pixels (which
  // are 1:1 with the game's 256-wide frame); we place them over the emulator's
  // picture, letterboxed to 4:3, plus the user's calibration nudge.
  window.__psxOverlay = (function () {
    const cv = document.getElementById('mapOverlay');
    const ctx = cv.getContext('2d');
    let last = null;
    function gameCanvas() {
      let best = null, area = 0;
      for (const c of document.querySelectorAll('#game canvas')) {
        const r = c.getBoundingClientRect();
        if (r.width * r.height > area) { area = r.width * r.height; best = c; }
      }
      return best;
    }
    function draw(list, calib) {
      last = [list, calib];
      const dpr = window.devicePixelRatio || 1;
      if (cv.width !== Math.round(innerWidth * dpr) || cv.height !== Math.round(innerHeight * dpr)) {
        cv.width = Math.round(innerWidth * dpr); cv.height = Math.round(innerHeight * dpr);
      }
      ctx.setTransform(1, 0, 0, 1, 0, 0);
      ctx.clearRect(0, 0, cv.width, cv.height);
      const gc = gameCanvas();
      if (!gc || !list || !list.length) return;
      const r = gc.getBoundingClientRect();
      const aspect = (calib && calib.aspect) || 4 / 3;
      let vw = r.width, vh = r.width / aspect;
      if (vh > r.height) { vh = r.height; vw = vh * aspect; }
      const vx = r.left + (r.width - vw) / 2, vy = r.top + (r.height - vh) / 2;
      const f = window.__psxFrame || { w: 256, h: 240 };
      const hs = f.w >= 480 ? 2 : 1, vs = f.h >= 400 ? 2 : 1; // hi-res / interlaced modes
      const c = calib || {};
      const sx = (vw / f.w) * hs * (c.scale || 1);
      const sy = (vh / f.h) * vs * (c.scale || 1);
      const ox = vx + (c.dx || 0) * sx;
      const oy = vy + (c.dy || 0) * sy;
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      parent.SotnMap.drawMarkers(ctx, list, sx, sy, ox, oy);
    }
    addEventListener('resize', () => { if (last) draw(last[0], last[1]); });
    return { draw, clear: () => draw([], null) };
  })();

  const s = document.createElement('script');
  s.src = window.EJS_pathtodata + 'loader.js';
  s.onerror = () => {
    const e = document.getElementById('err');
    e.style.display = 'flex';
    e.textContent = 'Could not load the emulator files from ' + window.EJS_pathtodata +
      '. The first launch needs internet to download the emulator (it is cached afterwards).';
    parent.postMessage({ type: 'emu:error' }, location.origin);
  };
  document.body.appendChild(s);
</script>
</body>
</html>
